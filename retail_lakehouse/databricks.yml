bundle:
  name: retail_lakehouse
  uuid: aa42ebf7-6c9a-4792-b03e-76a21d668b1d

include:
  - resources/*.yml
  - resources/*/*.yml

variables:
  catalog:
    description: "Unity Catalog catalog name for this environment"
