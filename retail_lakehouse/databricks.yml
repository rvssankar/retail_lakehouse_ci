    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-6002626c-5acc.cloud.databricks.com
    variables:
      catalog: dev_retail
      schema: dev
    
  staging:
    mode: production
    workspace:
      host: https://dbc-6002626c-5acc.cloud.databricks.com
      root_path: /Workspace/Users/info.sankar87@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: stg_retail
      schema: staging
    permissions:
      - user_name: info.sankar87@gmail.com
        level: CAN_MANAGE
        
  prod:
    mode: production
    workspace:
      host: https://dbc-6002626c-5acc.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/info.sankar87@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/info.sankar87@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
